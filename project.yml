name: Alarmy
options:
  deploymentTarget: { iOS: "16.0" }
packages:
  AlarmyCore: { path: Packages/AlarmyCore }
targets:
  Alarmy:
    type: application
    platform: iOS
    sources: [App]
    dependencies: [{ package: AlarmyCore }]
    scheme:
      testTargets: [AlarmyUITests]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.inverspe.alarmy
      MARKETING_VERSION: "0.1"
      CURRENT_PROJECT_VERSION: "1"
      TARGETED_DEVICE_FAMILY: "1"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Alarmy
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: "Alarmy photographs your objects and scans your barcodes to turn off the alarm."
        NSLocationWhenInUseUsageDescription: "Alarmy reads out the weather for your rough location, if you turn that on for an alarm."
        NSMotionUsageDescription: "Alarmy counts your steps to turn off the alarm."
        NSMicrophoneUsageDescription: "Alarmy never records you. iOS needs this on file to send the alarm to the phone's speaker while earbuds are connected."
        UIRequiresFullScreen: true
  AlarmyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies: [{ target: Alarmy }]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.inverspe.alarmy.uitests
      GENERATE_INFOPLIST_FILE: YES
      TEST_TARGET_NAME: Alarmy
