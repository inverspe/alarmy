name: alarmlock

on:
  push:
    branches: [alarmy-lock]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Test the lock rules
        run: |
          clang -fobjc-arc -Wall -framework Foundation AlarmLock/LockRules.m Tests/LockRulesTests.m -o lockrules-tests
          ./lockrules-tests

      - name: Build the add-on
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun -sdk iphoneos clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=15.0 \
            -fobjc-arc -Wall -Wno-deprecated-declarations -dynamiclib \
            -framework Foundation -framework UIKit -framework AVFoundation -framework UserNotifications -framework MetricKit \
            -install_name @rpath/AlarmLock.dylib \
            -o AlarmLock.dylib AlarmLock/AlarmLock.m AlarmLock/LockRules.m 2>&1 | tee build.log
          test -f AlarmLock.dylib
          codesign -f -s - AlarmLock.dylib
          otool -L AlarmLock.dylib
          otool -l AlarmLock.dylib | grep -A4 LC_BUILD_VERSION
          shasum -a 256 AlarmLock.dylib

      - name: Start a simulated iPhone
        run: |
          id=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if 'iPhone' in x['name']))")
          xcrun simctl boot "$id"
          xcrun simctl bootstatus "$id" -b

      - name: Run the add-on on it
        timeout-minutes: 8
        run: |
          bash Tests/Host/run.sh real
          grep -q "^RESULT .* 0 failures" host-real.log

      - name: Check the test notices background work
        timeout-minutes: 8
        run: |
          bash Tests/Host/run.sh noidle -DALTEST_NO_IDLE=1
          grep -q "^FAIL background: no reading of alarms" host-noidle.log
          grep -q "^FAIL background: no timer" host-noidle.log

      - name: Check the test notices the unlock gap
        timeout-minutes: 8
        run: |
          bash Tests/Host/run.sh gap -DALTEST_NO_RUN_CHECK=1
          grep -q "^FAIL after a restart, the Alarms tab showing doesn't end the ring" host-gap.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AlarmLock
          path: |
            AlarmLock.dylib
            build.log
            host-*.log
