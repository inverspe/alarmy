name: build

on:
  push:

defaults:
  run:
    shell: bash

permissions:
  contents: write

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Core tests
        run: swift test --package-path Packages/AlarmyCore 2>&1 | tee core-tests.log
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-tests-log
          path: core-tests.log

  build:
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: brew install xcodegen ldid
      - name: Generate project
        run: xcodegen generate
      - name: Build
        run: |
          xcodebuild -version
          xcodebuild -project Alarmy.xcodeproj -scheme Alarmy -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package
        run: bash scripts/package-tipa.sh
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message }}
          REF: ${{ github.ref_name }}
          RUN: ${{ github.run_number }}
        run: |
          PRE=--prerelease
          [ "$REF" = "main" ] && PRE=""
          gh release create "build-$RUN" Alarmy.tipa \
            --target "$GITHUB_SHA" --title "Build $RUN ($REF)" --notes "$NOTES" $PRE
