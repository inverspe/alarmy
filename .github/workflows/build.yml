name: alarmlock

on:
  push:
    branches: [alarmy-lock]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Test the lock rules
        run: |
          clang -fobjc-arc -Wall -framework Foundation AlarmLock/LockRules.m Tests/LockRulesTests.m -o lockrules-tests
          ./lockrules-tests

      - name: Build the add-on
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun -sdk iphoneos clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=15.0 \
            -fobjc-arc -Wall -Wno-deprecated-declarations -dynamiclib \
            -framework Foundation -framework UIKit \
            -install_name @rpath/AlarmLock.dylib \
            -o AlarmLock.dylib AlarmLock/AlarmLock.m AlarmLock/LockRules.m 2>&1 | tee build.log
          test -f AlarmLock.dylib
          codesign -f -s - AlarmLock.dylib
          otool -L AlarmLock.dylib
          otool -l AlarmLock.dylib | grep -A4 LC_BUILD_VERSION
          shasum -a 256 AlarmLock.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: AlarmLock
          path: |
            AlarmLock.dylib
            build.log
