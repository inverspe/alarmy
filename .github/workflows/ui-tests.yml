name: ui-tests

on:
  push:
    branches: [dev]
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      # The list of simulators is sometimes empty just after the machine starts, so keep asking.
      - name: Start a simulated iPhone
        run: |
          for attempt in 1 2 3 4 5 6 7 8; do
            udid=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name == "iPhone 16 Plus")][0].udid // empty')
            [ -n "$udid" ] && break
            echo "No simulator yet (attempt $attempt)"
            sleep 30
          done
          [ -n "$udid" ] || { xcrun simctl list; exit 1; }
          xcrun simctl bootstatus "$udid" -b
          echo "SIMULATOR=$udid" >> "$GITHUB_ENV"
      - name: Run on a simulated iPhone
        run: |
          set -o pipefail
          xcodebuild test -project Alarmy.xcodeproj -scheme Alarmy \
            -destination "platform=iOS Simulator,id=$SIMULATOR" \
            -resultBundlePath results.xcresult -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee ui-tests.log | grep -E "^(Test Case|Test Suite|.*error:|\*\*)" || exit 1
      - name: Collect screenshots
        if: always()
        run: |
          mkdir -p screenshots
          [ -d results.xcresult ] && xcrun xcresulttool export attachments --path results.xcresult --output-path screenshots || true
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: |
            screenshots
            ui-tests.log
