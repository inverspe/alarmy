name: ui-tests

on:
  push:
    branches: [dev]
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Run on a simulated iPhone
        run: |
          set -o pipefail
          xcodebuild test -project Alarmy.xcodeproj -scheme Alarmy \
            -destination 'platform=iOS Simulator,name=iPhone 16 Plus' \
            -resultBundlePath results.xcresult -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee ui-tests.log | grep -E "^(Test Case|Test Suite|.*error:|\*\*)" || exit 1
      - name: Collect screenshots
        if: always()
        run: |
          mkdir -p screenshots
          [ -d results.xcresult ] && xcrun xcresulttool export attachments --path results.xcresult --output-path screenshots || true
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: |
            screenshots
            ui-tests.log
